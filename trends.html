<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Immigration Stats - Yearly Trends</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="index.html">Immigration Stats</a>
      <div class="navbar-nav">
        <a class="nav-link" href="index.html">Overview</a>
        <a class="nav-link" href="trends.html">Yearly Trends</a>
      </div>
    </div>
  </nav>

  <div class="container py-4">
    <h1 class="mb-3">Immigration Statistics Yearly Trends</h1>
    <input type="search" id="yearSearch" class="form-control mb-3" placeholder="Search by year, e.g. 2008">

    <!-- Rows are added by trends.js -->
    <div class="table-responsive">
      <table class="table table-striped table-bordered">
        <thead>
          <tr>
            <th>Year</th>
            <th>Filed</th>
            <th>Grants</th>
            <th>Denials</th>
          </tr>
        </thead>
        <tbody id="trendsTableBody">
        </tbody>
      </table>
    </div>
  </div>

  <script src="trends.js" defer></script>
</body>
</html>
